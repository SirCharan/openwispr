name: ci-windows

on:
  push:
    branches: [master]
    paths:
      - "core/**"
      - "windows/**"
      - "Cargo.toml"
      - ".github/workflows/ci-windows.yml"
  pull_request:
    paths:
      - "core/**"
      - "windows/**"
      - "Cargo.toml"
      - ".github/workflows/ci-windows.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The point of this job: prove whisper.cpp still compiles under MSVC. It is the single
  # most likely thing to break the Windows port, so it gets its own job and fails loudly.
  whisper-msvc:
    name: whisper.cpp MSVC build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: whisper-asr
      # Only CMake needs to be on PATH. Do not probe for `cl` here: cargo's cc crate locates
      # MSVC through vswhere, so `cl` is absent from a plain shell and probing it fails the job
      # before the build it was meant to describe ever runs.
      - name: Report CMake version
        run: cmake --version
      - name: Build with the asr feature
        run: cargo build -p openwispr --features asr --release
      - name: Assert whisper.cpp produced a static library
        shell: pwsh
        run: |
          $libs = Get-ChildItem -Path target -Recurse -Filter "*whisper*.lib" -ErrorAction SilentlyContinue
          if (-not $libs) {
            throw "no whisper*.lib under target/ — CMake did not build whisper.cpp"
          }
          $libs | ForEach-Object { "built: $($_.FullName) ($([math]::Round($_.Length/1MB,1)) MB)" }

      # The `rust` job builds without the feature, so asr.rs is otherwise never linted.
      - name: Clippy and test with the asr feature
        run: |
          cargo clippy -p openwispr --features asr --all-targets -- -D warnings
          cargo test -p openwispr --features asr --release

      # models::dir() is %LOCALAPPDATA%\OpenWispr\models, so pointing LOCALAPPDATA into the
      # workspace makes the model cacheable. Keyed on the sha256 the code itself asserts.
      - name: Cache the CI model
        uses: actions/cache@v4
        with:
          path: appdata\OpenWispr\models\ggml-tiny.en.bin
          key: ggml-tiny-en-921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f

      - name: Download tiny.en through the app's own model manager
        shell: pwsh
        env:
          LOCALAPPDATA: ${{ github.workspace }}\appdata
        run: |
          $dir = "$env:LOCALAPPDATA\OpenWispr\models"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          # Cold cache: seed a 1 MiB .part so the resume (HTTP 206) path is the one exercised,
          # not skipped. A warm cache short-circuits on the sha256 instead.
          if (-not (Test-Path "$dir\ggml-tiny.en.bin")) {
            curl.exe -sL -r 0-1048575 -o "$dir\ggml-tiny.en.bin.part" `
              "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin"
          }
          & .\target\release\openwispr.exe --download-model tiny.en
          if ($LASTEXITCODE -ne 0) { throw "--download-model exited $LASTEXITCODE" }
          if (Test-Path "$dir\ggml-tiny.en.bin.part") { throw ".part left behind" }

      # The end-to-end ASR gate: a committed 2.6s recording of "This is a test of the speech
      # recognition system." must come back as text.
      - name: Transcribe the committed speech fixture
        shell: pwsh
        env:
          LOCALAPPDATA: ${{ github.workspace }}\appdata
        run: |
          $model = "$env:LOCALAPPDATA\OpenWispr\models\ggml-tiny.en.bin"
          $out = & .\target\release\openwispr.exe --transcribe-file core\fixtures\speech.wav $model 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "--transcribe-file exited $LASTEXITCODE" }
          $t = $out.ToLower()
          if ($t -notmatch "test" -or $t -notmatch "speech") { throw "transcript missing expected words" }

  app:
    name: app build + selftest
    runs-on: windows-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-bundle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install frontend dependencies
        working-directory: windows
        run: npm ci

      - name: Frontend typecheck, build and tests
        working-directory: windows
        run: |
          npm run build
          npm test

      - name: Build the app and NSIS installer
        working-directory: windows
        run: npm run tauri -- build

      # A release build is a GUI subsystem binary, so this also proves AttachConsole works
      # and CI is reading real output instead of asserting against an empty string.
      - name: Run headless selftest
        shell: pwsh
        run: |
          $exe = "target/release/openwispr.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $out = & $exe --selftest 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "--selftest exited $LASTEXITCODE" }
          if ($out -match "FAIL") { throw "a check failed" }
          if ($out -notmatch "checks passed") { throw "no output captured from --selftest" }

      # Exercises DXGI and GlobalMemoryStatusEx on a real Windows box. The runner has only the
      # Basic Render Driver, so it must report no discrete card and still exit 0.
      - name: Run the hardware probe
        shell: pwsh
        run: |
          $out = & target/release/openwispr.exe --hardware 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "--hardware exited $LASTEXITCODE" }
          if ($out -notmatch "recommended:") { throw "no recommendation printed" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenWispr-Setup
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
