[package]
name = "openwispr"
description = "OpenWispr for Windows — local-first voice dictation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openwispr-core = { path = "../../core" }
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WASAPI capture on Windows. cpal is cross-platform, so this module also compiles and runs
# on macOS, which is where it gets developed.
cpal = "0.18"

# whisper.cpp sits behind a feature flag: building it needs CMake and a C++ toolchain, so a
# contributor without CMake can still work on the UI, the core logic and the model manager.
# CI always builds with `--features asr` on windows-latest, which is what proves the MSVC
# build keeps working.
whisper-rs = { version = "0.16", optional = true }

# Model download. Blocking, so no async runtime: `default-features = false` drops gzip, which
# keeps the byte counter honest against content-length when resuming a partial file.
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_Console",           # AttachConsole, so --selftest can print from a GUI binary
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",            # CreateDXGIFactory1: find the GPU for the hardware probe
    "Win32_System_SystemInformation", # GlobalMemoryStatusEx: total RAM
] }

[features]
default = []
asr = ["whisper-rs"]
# Opt-in GPU offload, not built by default. It stays declared even while nothing enables it:
# hardware.rs reads cfg!(feature = "asr-gpu"), and an undeclared feature trips the
# unexpected_cfgs lint, which is an error under CI's `clippy -D warnings`.
asr-gpu = ["asr", "whisper-rs/vulkan"]
